<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visual complexity comparisons</title>
<style>
:root{color-scheme:dark;font:15px/1.5 system-ui,sans-serif;background:#101319;color:#e9edf4}*{box-sizing:border-box}body{margin:0}header{padding:20px 28px;border-bottom:1px solid #303845}h1{font-size:23px;margin:0}p{margin:8px 0;color:#bfc9d7}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:90vh}nav{padding:18px 12px;border-right:1px solid #303845}button{font:inherit;color:inherit;background:#242d3a;border:1px solid #465269;border-radius:7px;padding:8px 12px;cursor:pointer}button:disabled{opacity:.45;cursor:default}nav button{display:block;width:100%;text-align:left;margin-bottom:8px}nav button[aria-current=true]{background:#194862;border-color:#5cb9e7}nav small{display:block;color:#b8c8da}main{min-width:0;padding:20px 24px}h2{margin:0;font-size:21px}.panes{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}.pane{min-width:0}.pane h3{font-size:16px;margin:0 0 6px}.viewport{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden;border:1px solid #303845;border-radius:6px}.viewport iframe{position:absolute;inset:0;width:1280px;height:720px;border:0;transform-origin:top left}.placeholder{padding:20px;color:#aeb9c9;white-space:pre-wrap}.arm-status{font-size:13px;min-height:24px;overflow-wrap:anywhere}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:18px 0}input{flex:1;min-width:120px}#error{color:#ffb4ab;white-space:pre-wrap}#status{color:#92d8bb}table{border-collapse:collapse;width:100%;margin:18px 0}th,td{text-align:left;padding:8px 12px;border-bottom:1px solid #303845}th{color:#a9bbd1}details{margin:14px 0;color:#bfc9d7}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}#identity,#limits{font-size:13px}#instruction{max-width:100ch}@media(max-width:900px){.layout{grid-template-columns:1fr}nav{display:flex;flex-wrap:wrap;gap:6px;border-right:0}nav button{width:auto;flex:1;min-width:130px;margin:0}.panes{grid-template-columns:1fr}main{padding:16px}}
</style></head><body><header><h1>Visual complexity comparisons</h1><p>Exact model submissions · same input and settings · baseline vs helper guidance</p></header>
<div class="layout"><nav id="cases" aria-label="Comparison cases"></nav><main>
<h2 id="title">Loading verified evidence…</h2><p id="instruction"></p>
<div class="panes"><section class="pane"><h3>A · baseline</h3><div class="viewport" id="viewport-a"></div><p class="arm-status" id="status-a"></p></section><section class="pane"><h3>B · candidate</h3><div class="viewport" id="viewport-b"></div><p class="arm-status" id="status-b"></p></section></div>
<div class="controls"><button id="play" disabled>Play both</button><button id="restart" disabled>Restart</button><input id="seek" aria-label="Shared playback time" type="range" min="0" max="8" step=".01" value="0" disabled><span id="time">0.00 s</span></div>
<p id="status" role="status"></p><p id="error" role="alert"></p><p id="identity"></p>
<table><thead><tr><th>Recorded evidence</th><th>A · baseline</th><th>B · candidate</th></tr></thead><tbody id="metrics"></tbody></table>
<p id="limits"></p><details><summary>Source provenance</summary><pre id="provenance"></pre></details>
</main></div><script type="module" src="/main.ts"></script></body></html>
