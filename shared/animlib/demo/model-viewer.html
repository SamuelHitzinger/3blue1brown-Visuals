<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>animlib model viewer</title>
<style>*{box-sizing:border-box}body{margin:0;background:#11151d;color:#eaf0ff;font:15px system-ui}header{padding:20px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;border-bottom:1px solid #303748}h1{font-size:20px;margin:0}label,button,select{font:inherit}button,select,.file{background:#253247;border:1px solid #435774;color:#eaf0ff;padding:9px 12px;border-radius:8px;cursor:pointer}.file input{display:none}#stage{height:65vh;min-height:340px}canvas{display:block;width:100%;height:100%;touch-action:none}footer{padding:20px 24px;color:#abb8d0}#status{white-space:pre-wrap}select{max-width:220px}</style></head><body>
