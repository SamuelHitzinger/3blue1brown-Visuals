<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>animlib model checks</title>
<style>body{font:15px system-ui;background:#17191d;color:#eee;margin:24px}button{padding:12px;margin-right:12px}pre{white-space:pre-wrap}#stage{display:flex;flex-wrap:wrap}canvas{display:block}#gallery img{margin:12px}</style>
<h1>Imported models</h1><p>Real GLB downloads, embedded PNG decoding, UV maps, image materials, named parts and deterministic playback.</p><button id="gl">Test WebGL2</button><button id="gpu">Test WebGPU</button><pre id="results">Ready</pre><div id="stage"></div><div id="gallery"></div>
<script type="module">import {runModelBrowserTests} from '../test/models.browser.ts';for(const [id,backend] of [['gl','webgl2'],['gpu','webgpu']])document.getElementById(id).onclick=()=>{window.modelTests=runModelBrowserTests(backend).then(result=>{window.modelResult=result;document.getElementById('results').textContent=JSON.stringify(result,null,2);return result;});};</script></html>
