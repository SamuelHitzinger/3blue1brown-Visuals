name: Build, test, and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/app/package-lock.json
      - name: Validate deployment configuration
        run: |
          bash -n scripts/deploy-release.sh scripts/package-release.sh scripts/smoke-container.sh
          shellcheck scripts/deploy-release.sh scripts/package-release.sh scripts/smoke-container.sh
          python3 scripts/test-container-config.py
          python3 scripts/test-release-stream.py
          python3 scripts/test-cleanup-images.py
      - run: npm ci
      - run: npm ci --prefix frontend/app
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run typecheck --workspace @aha/backend
      - run: npm run test --workspace @aha/backend
      - run: npm run app:test
      - run: npm run app:build
      - run: npm run demo:build
      - name: Build, test container lifecycle, and package the Docker image
        env:
          DEPLOY_REVISION: ${{ github.sha }}
        run: bash scripts/package-release.sh "$DEPLOY_REVISION" "$RUNNER_TEMP/release"
      - name: Save the tested release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.sha }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: production
      url: https://11.hackathon.ethz.ch
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ github.sha }}
          path: release
      - name: Verify release checksum
        run: (cd release && sha256sum --check release.sha256)
      - name: Configure SSH
        env:
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          VM_SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
          VM_HOST: ${{ vars.VM_HOST }}
          VM_SSH_USER: ${{ vars.VM_SSH_USER }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          for name in ('VM_SSH_PRIVATE_KEY', 'VM_SSH_KNOWN_HOSTS', 'VM_HOST', 'VM_SSH_USER'):
              if not os.environ.get(name):
                  raise SystemExit(f'Missing deployment setting: {name}')
          host, user = os.environ['VM_HOST'], os.environ['VM_SSH_USER']
          if not re.fullmatch(r'[a-zA-Z0-9][a-zA-Z0-9.-]*', host):
              raise SystemExit('Invalid VM_HOST')
          if not re.fullmatch(r'[a-z_][a-z0-9_-]*', user):
              raise SystemExit('Invalid VM_SSH_USER')
          directory = Path(os.environ['RUNNER_TEMP']) / 'aha-ssh'
          directory.mkdir(mode=0o700)
          for name, value in [('key', os.environ['VM_SSH_PRIVATE_KEY']), ('known_hosts', os.environ['VM_SSH_KNOWN_HOSTS'])]:
              path = directory / name
              path.write_text(value.rstrip() + '\n')
              path.chmod(0o600)
          config = directory / 'config'
          config.write_text(f"""Host aha-prod
            HostName {host}
            User {user}
            IdentityFile {directory}/key
            UserKnownHostsFile {directory}/known_hosts
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            ConnectTimeout 15
            ServerAliveInterval 15
            ServerAliveCountMax 4
          """)
          config.chmod(0o600)
          PY
      - name: Skip a superseded main revision
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          APP_REPOSITORY: ${{ github.repository }}
          DEPLOY_REVISION: ${{ github.sha }}
        run: |
          latest=$(gh api "repos/$APP_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$latest" = "$DEPLOY_REVISION" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'A newer commit is on main; its workflow will deploy it.'
          fi
      - name: Deploy the tested Docker image over SSH
        if: steps.current.outputs.deploy == 'true'
        env:
          DEPLOY_REVISION: ${{ github.sha }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          # Alexander - Smooth, Deep and Round; runtime account needs voice access.
          ELEVENLABS_VOICE_ID: CQcj2MsUgZyAgfHH6yJV
          ELEVENLABS_MODEL_ID: eleven_multilingual_v2
          NARRATION_PUBLIC_ORIGIN: https://11.hackathon.ethz.ch
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          os.umask(0o077)
          lines = []
          for name in ('ELEVENLABS_API_KEY', 'ELEVENLABS_VOICE_ID', 'ELEVENLABS_MODEL_ID', 'NARRATION_PUBLIC_ORIGIN'):
              value = os.environ.get(name, '')
              if not value or any(char in value for char in '\r\n\x00'):
                  raise SystemExit(f'Missing or invalid deployment setting: {name}')
              escaped = value.replace('\\', '\\\\').replace('"', '\\"')
              lines.append(f'{name}="{escaped}"\n')
          path = Path(os.environ['RUNNER_TEMP']) / 'aha-ssh' / 'deployment.env'
          path.write_text(''.join(lines))
          path.chmod(0o600)
          PY
          (cd release && sha256sum --check release.sha256)
          config="$RUNNER_TEMP/aha-ssh/config"
          remote_dir=".cache/aha-deploy/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh -F "$config" aha-prod "umask 077 && mkdir -p -- '$remote_dir'"
          scp -F "$config" release/release.tar.gz release/release.sha256 scripts/deploy-release.sh "aha-prod:$remote_dir/"
          scp -F "$config" "$RUNNER_TEMP/aha-ssh/deployment.env" "aha-prod:$remote_dir/deployment.env"
          ssh -F "$config" aha-prod "cd '$remote_dir' && sha256sum --check release.sha256 && bash deploy-release.sh release.tar.gz '$DEPLOY_REVISION'"
      - name: Remove uploaded archive and temporary credentials
        if: always()
        run: |
          config="$RUNNER_TEMP/aha-ssh/config"
          remote_dir=".cache/aha-deploy/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if [ -f "$config" ]; then
            ssh -F "$config" aha-prod "rm -rf -- '$remote_dir'" || true
          fi
          rm -rf -- "$RUNNER_TEMP/aha-ssh"
