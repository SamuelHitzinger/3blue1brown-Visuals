<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Animlib Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a101b;color:#eef3ff;font:14px system-ui;overflow:hidden;height:100dvh;display:flex;flex-direction:column}
header{height:62px;display:flex;align-items:center;gap:18px;padding:0 24px;border-bottom:1px solid #253146}
h1{font-size:17px;letter-spacing:.02em;margin:0}#title{color:#93aac9;flex:1}button{background:#18263d;color:#eef3ff;border:1px solid #314764;border-radius:8px;padding:8px 16px;cursor:pointer}button:disabled{opacity:.4;cursor:wait}
header,footer{flex-shrink:0}main{flex:1;min-height:0;position:relative}canvas{display:block;width:100%;height:100%;touch-action:none}
footer{min-height:43px;padding:12px 24px;color:#93aac9;display:flex;gap:20px;flex-wrap:wrap}#status{flex:1}
#controls{display:flex;flex-wrap:wrap;gap:18px 32px;padding:14px 24px;border-top:1px solid #253146;background:#101a2b;max-height:35vh;overflow:auto}
#controls:empty{display:none}.parameter{display:grid;grid-template-columns:1fr auto;gap:8px 16px;flex:1;min-width:180px;max-width:420px}
.parameter label{color:#cad8ed}.parameter output{font-variant-numeric:tabular-nums;color:#83ddeb}
.parameter input{grid-column:1/-1;width:100%;margin:0;accent-color:#59c8dc;cursor:pointer}
#navigation{position:absolute;bottom:14px;left:24px;color:#aab8cc;font-size:12px;pointer-events:none}
button:focus-visible,input:focus-visible,canvas:focus-visible{outline:2px solid #83ddeb;outline-offset:3px}
@media(max-width:650px){header{padding:0 12px;gap:10px}h1{font-size:14px}#title{display:none}#controls{padding:12px;gap:14px}.parameter{min-width:140px}footer{padding:10px 12px}#navigation{left:12px}}
</style></head><body>
<header><h1>Animlib Studio</h1><span id="title">Persistent animation canvas</span><button id="reset-view" disabled>Reset view</button><button id="pause" disabled>Pause</button></header>
<main><canvas tabindex="0" aria-label="Animation scene" aria-describedby="navigation"></canvas><span id="navigation">Drag to rotate · Shift-drag to pan · Scroll to zoom</span></main>
<section id="controls" aria-label="Live animation parameters"></section>
<footer><span id="status" role="status">Preparing renderer…</span><span id="revision"></span></footer>
<script type="module" src="/viewer.ts"></script></body></html>
